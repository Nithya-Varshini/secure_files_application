name: secure_files_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.5

dependencies:
  animations: 2.2.0
  bip39_mnemonic: ^4.1.0
  camera: ^0.12.2
  # Use the Camera2 implementation instead of the default CameraX one:
  # CameraX never returned the still photo on a MediaTek Vivo (Android 14).
  camera_android: ^0.10.12
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.2
  image: ^4.12.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  mime: ^2.1.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfx: ^2.11.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
